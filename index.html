<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Método Julia · Francés</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172c41;background:#f5f8fb}*{box-sizing:border-box}body{margin:0}header{background:#17385a;color:white;padding:22px 16px}header>div{max-width:940px;margin:auto}h1{font-size:1.55rem;margin:0}header p{margin:7px 0 0;color:#e1edf7}main{max-width:940px;margin:auto;padding:18px 14px 50px}.sections{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}.sections button{flex-shrink:0}button,select{font:inherit;cursor:pointer;border:1px solid #cbd8e4;background:white;border-radius:11px;padding:10px 13px;color:#17385a;min-height:43px}button:focus-visible{outline:3px solid #e5a535}button.active,button.primary{background:#17385a;color:white;border-color:#17385a}.card{background:white;border:1px solid #dce5ed;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #17385a0a}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}h2{font-size:1.4rem;margin:5px 0}h3{font-size:1.04rem;margin:4px 0 12px}.muted{color:#53677c;line-height:1.5}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:13px 0}.row{padding:16px 0;border-top:1px solid #e3eaf1}.continuous{font-size:1.35rem;font-weight:600;line-height:2.05;overflow-wrap:anywhere}.sentence{display:inline}.sentence:focus-visible{outline:2px solid #e5a535;border-radius:4px}.sentence.current{background:#eaf3ff;border-radius:4px}.sentence-gap{display:inline} .sentence-tools{margin-top:12px}.sentence-tools button{font-size:.94rem}.translation-list{margin-top:12px}.translation-list p{margin:7px 0}.mask-inline{color:#6b7c8c;letter-spacing:.04em}.french{font-size:1.35rem;font-weight:600;line-height:1.9;overflow-wrap:anywhere}.word{font-size:inherit;font-weight:inherit;line-height:inherit;border:0;border-radius:5px;min-height:0;padding:0 2px;color:inherit;background:transparent}.word.playing{background:#ffe293;color:#152637}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.actions button{font-size:.94rem}.translation{margin:10px 0 0;padding:11px 14px;background:#edf5ff;border-radius:10px;font-size:1.08rem}.hint{padding:12px;background:#fff8e9;border:1px solid #f3dfad;border-radius:10px;margin-top:14px}.small{font-size:.88rem}.mask{letter-spacing:.06em;color:#6b7c8c}.bottom{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:18px}label{font-weight:600}.notice{font-size:.9rem;color:#4c6278;margin-top:12px}@media(max-width:550px){.french{font-size:1.19rem}.card{padding:13px}.actions button{flex:1 1 145px}}
</style></head><body><header><div><h1>🇫🇷 Método Julia · Mi exposición</h1><p>Una sección por vez, con todas sus frases juntas. Escuchá en francés y entendé en argentino.</p></div></header><main><nav id="sections" class="sections" aria-label="Secciones de la exposición"></nav><div class="card"><div class="top"><div><div class="muted small" id="counter"></div><h2 id="heading"></h2></div><div><label for="speed">Velocidad francés</label> <select id="speed"><option value="0.7">Lenta</option><option value="0.85" selected>Tranquila</option><option value="1">Normal</option></select></div></div><div class="tools"><button id="playAll" class="primary">▶ Escuchar toda la sección</button><button id="stop">■ Frenar</button><button id="showAll">🇦🇷 Mostrar traducciones</button></div><div class="tools" aria-label="Cómo practicar"><span class="muted small">Práctica:</span><button data-mode="comprender" class="active">Comprender</button><button data-mode="repetir">Repetir</button><button data-mode="memorizar">Memorizar</button></div><p id="instruction" class="muted"></p><div id="lines"></div><div id="gloss" class="hint" aria-live="polite">Tocá una palabra en francés para consultar su significado.</div><div class="bottom"><button id="prev">← Sección anterior</button><button id="next" class="primary">Siguiente sección →</button></div><p class="notice" id="voiceStatus"></p></div></main><script>
const DATA={"sections": [{"icon": "👋", "title": "Je me présente", "lines": [{"fr": "Bonjour !", "es": "¡Hola!"}, {"fr": "Je me présente.", "es": "Me presento."}, {"fr": "Je m’appelle Julia.", "es": "Me llamo Julia."}, {"fr": "J’ai onze ans.", "es": "Tengo once años."}, {"fr": "Je suis argentine et je suis élève.", "es": "Soy argentina y soy alumna."}]}, {"icon": "🍝", "title": "Mes goûts", "lines": [{"fr": "J’adore les milanaises.", "es": "Me encantan las milanesas."}, {"fr": "J’aime les pâtes.", "es": "Me gustan las pastas."}, {"fr": "Je déteste les algues.", "es": "Odio las algas."}]}, {"icon": "🏡", "title": "Ma famille", "lines": [{"fr": "J’habite avec ma famille.", "es": "Vivo con mi familia."}, {"fr": "Mon père s’appelle Marc.", "es": "Mi papá se llama Marc."}, {"fr": "Il a quarante ans.", "es": "Tiene cuarenta años."}, {"fr": "Il est expert-comptable.", "es": "Es contador público."}, {"fr": "Ma mère s’appelle Sophie.", "es": "Mi mamá se llama Sophie."}, {"fr": "Elle a quarante ans.", "es": "Tiene cuarenta años."}, {"fr": "Elle est experte-comptable.", "es": "Es contadora pública."}, {"fr": "Ma sœur s’appelle Emma.", "es": "Mi hermana se llama Emma."}, {"fr": "Elle a douze ans.", "es": "Tiene doce años."}]}, {"icon": "⏰", "title": "Le matin", "lines": [{"fr": "D’abord, je me réveille à six heures cinquante-cinq.", "es": "Primero me despierto a las seis y cincuenta y cinco."}, {"fr": "Ensuite, je vais à la salle de bains.", "es": "Después voy al baño."}, {"fr": "Je me brosse les dents et je me lave.", "es": "Me cepillo los dientes y me lavo."}, {"fr": "Puis, je prends mon petit-déjeuner.", "es": "Después desayuno."}, {"fr": "À sept heures trente, je pars pour l’école.", "es": "A las siete y media salgo para el colegio."}]}, {"icon": "🏫", "title": "À l’école", "lines": [{"fr": "J’étudie de huit heures à seize heures trente.", "es": "Estudio de ocho a cuatro y media de la tarde."}, {"fr": "À midi, je déjeune à la cantine de l’école.", "es": "Al mediodía almuerzo en el comedor del colegio."}]}, {"icon": "🏑", "title": "Après l’école", "lines": [{"fr": "Après l’école, je fais du hockey.", "es": "Después del colegio hago hockey."}, {"fr": "Je rentre à la maison et je me douche.", "es": "Vuelvo a casa y me ducho."}, {"fr": "Je dîne en famille.", "es": "Ceno en familia."}, {"fr": "À vingt-deux heures trente, je me couche.", "es": "A las diez y media de la noche me acuesto."}]}], "glossary": {"je me présente": "me presento", "je m’appelle": "me llamo", "j’ai": "tengo", "je suis": "soy / estoy", "j’adore": "me encanta", "j’aime": "me gusta", "je déteste": "odio / detesto", "j’habite": "vivo", "mon père": "mi papá", "ma mère": "mi mamá", "ma sœur": "mi hermana", "il est": "él es", "elle est": "ella es", "il a": "él tiene", "elle a": "ella tiene", "je me réveille": "me despierto", "je vais": "voy", "je me brosse": "me cepillo", "je me lave": "me lavo", "je prends": "tomo / desayuno", "je pars": "salgo", "j’étudie": "estudio", "je déjeune": "almuerzo", "je fais": "hago", "je rentre": "vuelvo", "je me douche": "me ducho", "je dîne": "ceno", "je me couche": "me acuesto", "bonjour": "hola", "avec": "con", "famille": "familia", "argentine": "argentina", "élève": "alumna", "onze": "once", "douze": "doce", "quarante": "cuarenta", "six": "seis", "cinquante-cinq": "cincuenta y cinco", "sept": "siete", "trente": "treinta", "huit": "ocho", "seize": "dieciséis", "vingt-deux": "veintidós", "heures": "horas", "heure": "hora", "ans": "años", "les": "los / las", "le": "el", "la": "la", "à": "a / en", "de": "de", "et": "y", "puis": "después", "ensuite": "después", "d’abord": "primero", "après": "después", "école": "colegio", "maison": "casa", "pâtes": "pastas", "milanaises": "milanesas", "algues": "algas", "hockey": "hockey", "dents": "dientes", "petit-déjeuner": "desayuno", "cantine": "comedor escolar", "midi": "mediodía", "soir": "noche", "salle": "sala", "bains": "baño", "comptable": "contador/a", "expert-comptable": "contador público", "experte-comptable": "contadora pública", "s’appelle": "se llama", "composée": "compuesta", "père": "papá", "mère": "mamá", "sœur": "hermana", "pour": "para", "du": "del", "des": "de los / de las", "mes": "mis", "ma": "mi", "mon": "mi", "une": "una", "un": "un", "en": "en", "à la": "a la", "de l’école": "del colegio"}};
let section=0,mode='comprender',translations=false,mask=0,voiceFR=null,voiceAR=null,activeLine=-1,activeWord=-1,sequence=0;
const $=id=>document.getElementById(id),safe=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const words=s=>s.match(/\S+/g)||[];
function chooseVoices(){if(!('speechSynthesis' in window)){$('voiceStatus').textContent='Este navegador no permite reproducir voz.';return}let v=speechSynthesis.getVoices();voiceFR=v.find(x=>x.lang.toLowerCase()==='fr-fr'&&x.localService)||v.find(x=>x.lang.toLowerCase()==='fr-fr')||v.find(x=>x.lang.toLowerCase().startsWith('fr'));voiceAR=v.find(x=>x.lang.toLowerCase()==='es-ar'&&/isabela/i.test(x.name))||v.find(x=>x.lang.toLowerCase()==='es-ar')||v.find(x=>x.lang.toLowerCase().startsWith('es'));$('voiceStatus').textContent='Francés: '+(voiceFR?.name||'voz del sistema (fr-FR)')+' · Castellano: '+(voiceAR?.name||'voz del sistema (es-AR)')+'. El karaoke depende de los eventos de voz del navegador.'}
function stop(){sequence++;if('speechSynthesis'in window)speechSynthesis.cancel();activeLine=-1;activeWord=-1;mark()}
function mark(){document.querySelectorAll('.word').forEach(el=>el.classList.toggle('playing',+el.dataset.line===activeLine&&+el.dataset.word===activeWord))}
function speak(text,lang,li,done){if(!('speechSynthesis'in window))return;let token=++sequence;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang==='fr'?'fr-FR':'es-AR';u.voice=lang==='fr'?voiceFR:voiceAR;u.rate=lang==='fr'?Number($('speed').value):.86;u.pitch=1;activeLine=li;activeWord=-1;mark();let w=words(text),offsets=[],pos=0;for(let part of w){let n=text.indexOf(part,pos);offsets.push(n);pos=n+part.length}if(lang==='fr'){u.onboundary=e=>{if(token!==sequence)return;if(typeof e.charIndex==='number'){let k=0;for(let j=0;j<offsets.length;j++)if(offsets[j]<=e.charIndex)k=j;activeWord=k;mark()}}}u.onend=()=>{if(token!==sequence)return;activeLine=-1;activeWord=-1;mark();if(done)done()};u.onerror=()=>{if(token===sequence){activeLine=-1;activeWord=-1;mark()}};speechSynthesis.speak(u)}
function playAll(){let a=DATA.sections[section].lines;let i=0;function next(){if(i<a.length)speak(a[i].fr,'fr',i++,next)}stop();next()}
function masked(s){if(mode!=='memorizar'||mask===0)return s;return words(s).map((w,i)=>mask===1?(i%3===1?'_____':w):mask===2?(i%4===0?w:'_____'):'_____').join(' ')}
function wordHTML(s,li){return words(s).map((w,i)=>`<button class="word" data-line="${li}" data-word="${i}" aria-label="Significado de ${safe(w)}">${safe(w)}</button>`).join(' ')}
function meaning(w){let x=w.toLocaleLowerCase('fr').replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'');return DATA.glossary[x]||'Escuchá la traducción de la frase para entender esta palabra en contexto.'}
function render(){let a=DATA.sections[section];$('sections').innerHTML=DATA.sections.map((s,i)=>`<button data-section="${i}" class="${i===section?'active':''}">${s.icon} ${safe(s.title)}</button>`).join('');$('counter').textContent=`Sección ${section+1} de ${DATA.sections.length}`;$('heading').textContent=a.icon+' '+a.title;$('instruction').textContent=mode==='comprender'?'Leé el texto de corrido. Tocá una palabra para saber qué significa; tocá una oración para escucharla.':mode==='repetir'?'Escuchá toda la sección y repetí. También podés tocar una oración para practicarla sola.':'Recordá el texto de corrido. Usá «Menos texto» para retirar ayudas.';
$('lines').innerHTML=`<div class="continuous" id="continuous" lang="fr">${a.lines.map((l,i)=>`<span class="sentence" data-sentence="${i}" title="Tocá para escuchar esta oración">${mode==='memorizar'&&mask>0?`<span class="mask-inline">${safe(masked(l.fr))}</span>`:wordHTML(l.fr,i)}</span>`).join(' ')}</div><div class="sentence-tools tools"><button id="listenSelected">🇫🇷 Escuchar frase elegida</button><button id="translateSelected">🇦🇷 Significado de la frase elegida</button></div><div id="translationBox" class="translation-list translation" ${translations?'':'hidden'}>${a.lines.map((l,i)=>`<p><strong>${i+1}.</strong> ${safe(l.es)}</p>`).join('')}</div>${mode==='memorizar'?`<div class="tools"><button id="less">Menos texto</button><button id="more">Más texto</button></div>`:''}`;
$('showAll').textContent=translations?'🇦🇷 Ocultar traducciones':'🇦🇷 Mostrar traducciones';$('prev').disabled=section===0;$('next').disabled=section===DATA.sections.length-1;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>changeSection(+b.dataset.section));
let selected=0;const choose=i=>{selected=i;document.querySelectorAll('[data-sentence]').forEach(e=>e.classList.toggle('current',+e.dataset.sentence===i))};document.querySelectorAll('[data-sentence]').forEach(e=>e.onclick=event=>{choose(+e.dataset.sentence);if(event.target.closest('[data-word]'))return;speak(a.lines[selected].fr,'fr',selected)});document.querySelectorAll('[data-word]').forEach(b=>b.onclick=event=>{event.stopPropagation();choose(+b.dataset.line);$('gloss').textContent=b.textContent+' → '+meaning(b.textContent)});$('listenSelected').onclick=()=>speak(a.lines[selected].fr,'fr',selected);$('translateSelected').onclick=()=>{$('gloss').textContent=a.lines[selected].fr+' → '+a.lines[selected].es};if($('less'))$('less').onclick=()=>{mask=Math.min(3,mask+1);render()};if($('more'))$('more').onclick=()=>{mask=Math.max(0,mask-1);render()}}

function changeSection(n){stop();section=n;mask=0;render();window.scrollTo({top:0,behavior:'smooth'})}
$('playAll').onclick=playAll;$('stop').onclick=stop;$('showAll').onclick=()=>{translations=!translations;render()};$('prev').onclick=()=>changeSection(section-1);$('next').onclick=()=>changeSection(section+1);document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{stop();mode=b.dataset.mode;mask=0;render()});if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=chooseVoices;chooseVoices()}render();
</script></body></html>
